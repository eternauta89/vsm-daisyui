<dialog
  id="capturar_firma_modal"
  class="modal"
  x-data="{
    hasSignature: false,
    drawing: false,
    ctx: null,
    init() { this.ctx = this.$refs.canvas.getContext('2d') },
    pos(event) {
      const rect = this.$refs.canvas.getBoundingClientRect()
      return {
        x: ((event.clientX - rect.left) * this.$refs.canvas.width) / rect.width,
        y: ((event.clientY - rect.top) * this.$refs.canvas.height) / rect.height,
      }
    },
    start(event) {
      this.drawing = true
      const p = this.pos(event)
      this.ctx.beginPath()
      this.ctx.moveTo(p.x, p.y)
    },
    draw(event) {
      if (!this.drawing) return
      const p = this.pos(event)
      this.ctx.lineWidth = 2.5
      this.ctx.lineCap = 'round'
      this.ctx.strokeStyle = '#020509'
      this.ctx.lineTo(p.x, p.y)
      this.ctx.stroke()
      this.hasSignature = true
    },
    stop() { this.drawing = false },
    limpiar() {
      this.ctx.clearRect(0, 0, this.$refs.canvas.width, this.$refs.canvas.height)
      this.hasSignature = false
    },
  }"
  x-on:close="limpiar()"
>
  <div class="modal-box w-full max-w-lg overflow-hidden p-0">
    <div class="bg-primary text-primary-content flex items-start justify-between px-6 py-4">
      <div>
        <p class="text-xs tracking-wide opacity-80">VALE <span id="firma-vsm"></span></p>
        <p class="text-lg font-medium" id="firma-retirante"></p>
        <p class="text-sm opacity-80" id="firma-legajo"></p>
      </div>
      <form method="dialog">
        <button type="submit" class="btn btn-circle btn-ghost text-primary-content text-2xl leading-none" aria-label="Cerrar">
          &times;
        </button>
      </form>
    </div>

    <div class="px-6 py-5">
      <p class="text-base-content/70 text-sm">
        Pedile al retirante que firme dentro del recuadro para confirmar la conformidad con los materiales.
      </p>

      <div class="border-base-300 bg-base-100 mt-4 overflow-hidden rounded-lg border">
        <canvas
          x-ref="canvas"
          width="600"
          height="220"
          class="h-48 w-full touch-none"
          x-on:pointerdown="start($event)"
          x-on:pointermove="draw($event)"
          x-on:pointerup="stop()"
          x-on:pointerleave="stop()"
        ></canvas>
      </div>

      <form id="firma-form" method="post" action="">
        {% csrf_token %}
        <div class="modal-action items-center justify-between">
          <button type="button" class="btn btn-ghost gap-1" x-on:click="limpiar()">
            {% include 'core/partials/icon.html' with name='eraser' extra='size-4' %}
            Limpiar
          </button>
          <button type="submit" class="btn btn-primary" x-bind:disabled="!hasSignature">Guardar firma</button>
        </div>
      </form>
    </div>
  </div>
  <form method="dialog" class="modal-backdrop"><button>close</button></form>
</dialog>
